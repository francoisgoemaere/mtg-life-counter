<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTG Life Counter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        overflow: hidden;
        transition: background-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                    color 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      html, body, #root { height: 100%; width: 100%; }

      /* Liquid Glass CSS Custom Properties */
      :root {
        /* Optimized blur intensities - lighter for light mode, deeper for dark mode */
        --glass-blur-light: 18px;
        --glass-blur-dark: 24px;
        --glass-blur-intense-light: 28px;
        --glass-blur-intense-dark: 32px;
        
        /* Optimized opacity - balanced for readability and depth */
        --glass-opacity-light: 0.82;
        --glass-opacity-dark: 0.78;
        --glass-card-opacity-light: 0.75;
        --glass-card-opacity-dark: 0.72;
        --glass-button-opacity-light: 0.5;
        --glass-button-opacity-dark: 0.55;
        --glass-header-opacity-light: 0.65;
        --glass-header-opacity-dark: 0.68;
        
        /* Border opacity optimized for contrast */
        --glass-border-opacity-light: 0.22;
        --glass-border-opacity-dark: 0.18;
        
        /* Shadows optimized for depth perception */
        --glass-shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
        --glass-shadow-dark: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
        --glass-shadow-card-light: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        --glass-shadow-card-dark: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        
        /* Smooth transitions for all mode changes */
        --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-bg: background-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                         backdrop-filter 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                         box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                         border-color 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Glass Surface Base Classes */
      .glass-surface {
        backdrop-filter: blur(var(--glass-blur-light));
        -webkit-backdrop-filter: blur(var(--glass-blur-light));
        background: rgba(255, 255, 255, var(--glass-opacity-light));
        border: 1px solid rgba(255, 255, 255, var(--glass-border-opacity-light));
        box-shadow: var(--glass-shadow-light);
        transition: var(--transition-bg);
      }

      .glass-surface-dark {
        backdrop-filter: blur(var(--glass-blur-dark));
        -webkit-backdrop-filter: blur(var(--glass-blur-dark));
        background: rgba(31, 41, 55, var(--glass-opacity-dark));
        border: 1px solid rgba(255, 255, 255, var(--glass-border-opacity-dark));
        box-shadow: var(--glass-shadow-dark);
        transition: var(--transition-bg);
      }

      .glass-surface-intense {
        backdrop-filter: blur(var(--glass-blur-intense-light));
        -webkit-backdrop-filter: blur(var(--glass-blur-intense-light));
      }

      .glass-surface-intense.dark {
        backdrop-filter: blur(var(--glass-blur-intense-dark));
        -webkit-backdrop-filter: blur(var(--glass-blur-intense-dark));
      }

      /* Glass Background Overlay - Made more transparent to allow animated background visibility */
      .glass-bg-light {
        background: linear-gradient(135deg, rgba(249, 250, 251, 0.15) 0%, rgba(243, 244, 246, 0.12) 100%);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        transition: var(--transition-bg);
        position: relative;
        z-index: 1;
      }

      .glass-bg-dark {
        background: linear-gradient(135deg, rgba(17, 24, 39, 0.18) 0%, rgba(31, 41, 55, 0.15) 100%);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        transition: var(--transition-bg);
        position: relative;
        z-index: 1;
      }

      /* Glass Card Classes */
      .glass-card {
        backdrop-filter: blur(var(--glass-blur-light));
        -webkit-backdrop-filter: blur(var(--glass-blur-light));
        border: 1px solid rgba(255, 255, 255, var(--glass-border-opacity-light));
        box-shadow: var(--glass-shadow-card-light);
        transition: var(--transition-bg);
      }

      .glass-card-light {
        background: rgba(255, 255, 255, var(--glass-card-opacity-light));
        backdrop-filter: blur(var(--glass-blur-light));
        -webkit-backdrop-filter: blur(var(--glass-blur-light));
        border: 1px solid rgba(255, 255, 255, var(--glass-border-opacity-light));
        box-shadow: var(--glass-shadow-card-light);
        transition: var(--transition-bg);
      }

      .glass-card-dark {
        background: rgba(31, 41, 55, var(--glass-card-opacity-dark));
        backdrop-filter: blur(var(--glass-blur-dark));
        -webkit-backdrop-filter: blur(var(--glass-blur-dark));
        border: 1px solid rgba(255, 255, 255, var(--glass-border-opacity-dark));
        box-shadow: var(--glass-shadow-card-dark);
        transition: var(--transition-bg);
      }

      /* Glass Button Classes */
      .glass-button-light {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, var(--glass-button-opacity-light));
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.08);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-light:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(255, 255, 255, 0.65);
        border-color: rgba(255, 255, 255, 0.38);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.18);
      }

      .glass-button-light:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.12);
      }

      .glass-button-dark {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(31, 41, 55, var(--glass-button-opacity-dark));
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.32);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-dark:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(31, 41, 55, 0.72);
        border-color: rgba(255, 255, 255, 0.24);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.42);
      }

      .glass-button-dark:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.38);
      }

      /* Glass Button - Red (Life decrease) */
      .glass-button-red-light {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(220, 38, 38, 0.72);
        border: 1px solid rgba(220, 38, 38, 0.42);
        box-shadow: 0 2px 8px 0 rgba(220, 38, 38, 0.18);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-red-light:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(220, 38, 38, 0.88);
        border-color: rgba(220, 38, 38, 0.52);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(220, 38, 38, 0.32);
      }

      .glass-button-red-dark {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(220, 38, 38, 0.65);
        border: 1px solid rgba(248, 113, 113, 0.32);
        box-shadow: 0 2px 8px 0 rgba(220, 38, 38, 0.32);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-red-dark:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(220, 38, 38, 0.78);
        border-color: rgba(248, 113, 113, 0.42);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(220, 38, 38, 0.48);
      }

      /* Glass Button - Green (Life increase) */
      .glass-button-green-light {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(34, 197, 94, 0.72);
        border: 1px solid rgba(34, 197, 94, 0.42);
        box-shadow: 0 2px 8px 0 rgba(34, 197, 94, 0.18);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-green-light:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(34, 197, 94, 0.88);
        border-color: rgba(34, 197, 94, 0.52);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(34, 197, 94, 0.32);
      }

      .glass-button-green-dark {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(34, 197, 94, 0.65);
        border: 1px solid rgba(74, 222, 128, 0.32);
        box-shadow: 0 2px 8px 0 rgba(34, 197, 94, 0.32);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-green-dark:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(34, 197, 94, 0.78);
        border-color: rgba(74, 222, 128, 0.42);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(34, 197, 94, 0.48);
      }

      /* Glass Button - Blue (Selected/Active state) */
      .glass-button-blue-light {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(37, 99, 235, 0.72);
        border: 1px solid rgba(37, 99, 235, 0.42);
        box-shadow: 0 2px 8px 0 rgba(37, 99, 235, 0.18);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-blue-light:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(37, 99, 235, 0.88);
        border-color: rgba(37, 99, 235, 0.52);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(37, 99, 235, 0.32);
      }

      .glass-button-blue-dark {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(37, 99, 235, 0.65);
        border: 1px solid rgba(96, 165, 250, 0.32);
        box-shadow: 0 2px 8px 0 rgba(37, 99, 235, 0.32);
        transition: var(--transition-bg), transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-button-blue-dark:hover {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(37, 99, 235, 0.78);
        border-color: rgba(96, 165, 250, 0.42);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(37, 99, 235, 0.48);
      }

      /* Glass Input Classes */
      .glass-input {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        transition: var(--transition-bg);
      }

      .glass-input:focus {
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        background: rgba(255, 255, 255, 0.12);
        outline: none;
        border-color: rgba(255, 255, 255, 0.28);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
      }

      .glass-input-dark {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .glass-input-dark:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      }

      /* Glass Header Classes */
      .glass-header-light {
        background: rgba(255, 255, 255, var(--glass-header-opacity-light));
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-bottom: 1px solid rgba(255, 255, 255, var(--glass-border-opacity-light));
        transition: var(--transition-bg);
      }

      .glass-header-dark {
        background: rgba(17, 24, 39, var(--glass-header-opacity-dark));
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-bottom: 1px solid rgba(255, 255, 255, var(--glass-border-opacity-dark));
        transition: var(--transition-bg);
      }

      /* Performance Optimizations */
      .glass-surface,
      .glass-card,
      .glass-button-light,
      .glass-button-dark,
      .glass-button-red-light,
      .glass-button-red-dark,
      .glass-button-green-light,
      .glass-button-green-dark,
      .glass-button-blue-light,
      .glass-button-blue-dark,
      .glass-input {
        will-change: transform, backdrop-filter;
      }

      /* Fallback for browsers without backdrop-filter support */
      @supports not (backdrop-filter: blur(1px)) {
        .glass-surface,
        .glass-surface-dark,
        .glass-card-light,
        .glass-card-dark {
          background: rgba(255, 255, 255, 0.95);
        }

        .glass-bg-light {
          background: rgb(249, 250, 251);
        }

        .glass-bg-dark {
          background: rgb(17, 24, 39);
        }

        .glass-header-light {
          background: rgba(255, 255, 255, 0.98);
        }

        .glass-header-dark {
          background: rgba(17, 24, 39, 0.98);
        }

        .glass-button-light {
          background: rgba(255, 255, 255, 0.9);
        }

        .glass-button-dark {
          background: rgba(31, 41, 55, 0.9);
        }

        .glass-button-red-light,
        .glass-button-red-dark {
          background: rgba(220, 38, 38, 0.9);
        }

        .glass-button-green-light,
        .glass-button-green-dark {
          background: rgba(34, 197, 94, 0.9);
        }

        .glass-button-blue-light,
        .glass-button-blue-dark {
          background: rgba(37, 99, 235, 0.9);
        }
      }

      /* Apple-Style Animated Background */
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes gradientMesh1 {
        0% {
          transform: translate(0%, 0%) scale(1);
        }
        33% {
          transform: translate(20%, -15%) scale(1.1);
        }
        66% {
          transform: translate(-10%, 20%) scale(0.95);
        }
        100% {
          transform: translate(0%, 0%) scale(1);
        }
      }

      @keyframes gradientMesh2 {
        0% {
          transform: translate(0%, 0%) scale(1);
        }
        33% {
          transform: translate(-15%, 20%) scale(0.9);
        }
        66% {
          transform: translate(25%, -10%) scale(1.05);
        }
        100% {
          transform: translate(0%, 0%) scale(1);
        }
      }

      @keyframes gradientMesh3 {
        0% {
          transform: translate(0%, 0%) scale(1);
        }
        33% {
          transform: translate(10%, 25%) scale(1.08);
        }
        66% {
          transform: translate(-20%, -5%) scale(0.92);
        }
        100% {
          transform: translate(0%, 0%) scale(1);
        }
      }

      .animated-bg-light,
      .animated-bg-dark {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .animated-bg-light::before,
      .animated-bg-light::after,
      .animated-bg-dark::before,
      .animated-bg-dark::after {
        content: '';
        position: absolute;
        width: 150%;
        height: 150%;
        border-radius: 50%;
        opacity: 0.6;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      .animated-bg-light::before {
        background: radial-gradient(
          circle at 30% 40%,
          rgba(147, 197, 253, 0.4) 0%,
          rgba(219, 234, 254, 0.3) 30%,
          transparent 70%
        );
        top: -25%;
        left: -25%;
        animation: gradientMesh1 8s ease-in-out infinite;
      }

      .animated-bg-light::after {
        background: radial-gradient(
          circle at 70% 60%,
          rgba(252, 211, 77, 0.35) 0%,
          rgba(254, 240, 138, 0.25) 30%,
          transparent 70%
        );
        top: -25%;
        left: -25%;
        animation: gradientMesh2 10s ease-in-out infinite;
      }

      .animated-bg-dark::before {
        background: radial-gradient(
          circle at 30% 40%,
          rgba(59, 130, 246, 0.35) 0%,
          rgba(37, 99, 235, 0.25) 30%,
          transparent 70%
        );
        top: -25%;
        left: -25%;
        animation: gradientMesh1 8s ease-in-out infinite;
      }

      .animated-bg-dark::after {
        background: radial-gradient(
          circle at 70% 60%,
          rgba(139, 92, 246, 0.3) 0%,
          rgba(124, 58, 237, 0.2) 30%,
          transparent 70%
        );
        top: -25%;
        left: -25%;
        animation: gradientMesh2 10s ease-in-out infinite;
      }

      /* Additional gradient layer for more depth */
      .animated-bg-light {
        background: linear-gradient(
          135deg,
          rgba(249, 250, 251, 0.95) 0%,
          rgba(243, 244, 246, 0.92) 25%,
          rgba(239, 246, 255, 0.94) 50%,
          rgba(254, 249, 195, 0.93) 75%,
          rgba(249, 250, 251, 0.95) 100%
        );
        background-size: 400% 400%;
        animation: gradientShift 12s ease-in-out infinite;
      }

      .animated-bg-dark {
        background: linear-gradient(
          135deg,
          rgba(17, 24, 39, 0.98) 0%,
          rgba(30, 41, 59, 0.96) 25%,
          rgba(30, 27, 75, 0.97) 50%,
          rgba(55, 48, 163, 0.96) 75%,
          rgba(17, 24, 39, 0.98) 100%
        );
        background-size: 400% 400%;
        animation: gradientShift 12s ease-in-out infinite;
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide icons as inline SVG components
        const Moon = () => (

            </svg>

        const Sun = () => (

                <circle cx="12" cy="12" r="5"></circle>

        const RotateCcw = () => (

                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>

        const Maximize = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        const Minimize = () => (

                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>

        const Users = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>

        const Skull = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="9" cy="12" r="1"></circle>
                <circle cx="15" cy="12" r="1"></circle>
                <path d="M8 20v2h8v-2"></path>
                <path d="M12.5 17-.5.5a1 1 0 0 0-1 0l-.5.5"></path>
                <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path>
            </svg>
        );

        const Zap = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
        );

        const Award = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="8" r="7"></circle>
                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </svg>
        );

        const Droplet = ({ size = 14 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
        );

        function MTGLifeCounter() {
            const [darkMode, setDarkMode] = useState(true);
            const [numPlayers, setNumPlayers] = useState(2);
            const [history, setHistory] = useState([]);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [players, setPlayers] = useState([
                { 
                    name: 'Player 1', 
                    life: 40, 
                    commanderDamage: {},
                    poison: 0,
                    energy: 0,
                    experience: 0
                },
                { 
                    name: 'Player 2', 
                    life: 40, 
                    commanderDamage: {},
                    poison: 0,
                    energy: 0,
                    experience: 0
                }
            ]);

            useEffect(() => {
                const newPlayers = Array(numPlayers).fill(null).map((_, i) => {
                    if (players[i]) return players[i];
                    return {
                        name: `Player ${i + 1}`,
                        life: 40,
                        commanderDamage: {},
                        poison: 0,
                        energy: 0,
                        experience: 0
                    };
                });
                setPlayers(newPlayers);
            }, [numPlayers]);

            // Listen for fullscreen changes
            useEffect(() => {
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!(
                        document.fullscreenElement ||
                        document.webkitFullscreenElement ||
                        document.mozFullScreenElement ||
                        document.msFullscreenElement
                    ));
                };

                document.addEventListener('fullscreenchange', handleFullscreenChange);
                document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
                document.addEventListener('mozfullscreenchange', handleFullscreenChange);
                document.addEventListener('MSFullscreenChange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
                    document.removeEventListener('mozfullscreenchange', handleFullscreenChange);
                    document.removeEventListener('MSFullscreenChange', handleFullscreenChange);
                };
            }, []);

            const saveHistory = () => {
                setHistory([...history, JSON.parse(JSON.stringify(players))]);
            };

            const undo = () => {
                if (history.length > 0) {
                    const previous = history[history.length - 1];
                    setPlayers(previous);
                    setHistory(history.slice(0, -1));
                }
            };

            const updateLife = (playerIndex, amount) => {
                saveHistory();
                const newPlayers = [...players];
                newPlayers[playerIndex].life += amount;
                setPlayers(newPlayers);
            };

            const updateCounter = (playerIndex, counterType, amount) => {
                saveHistory();
                const newPlayers = [...players];
                newPlayers[playerIndex][counterType] = Math.max(0, newPlayers[playerIndex][counterType] + amount);
                setPlayers(newPlayers);
            };

            const updateCommanderDamage = (playerIndex, fromPlayerIndex, amount) => {
                saveHistory();
                const newPlayers = [...players];
                const currentDamage = newPlayers[playerIndex].commanderDamage[fromPlayerIndex] || 0;
                newPlayers[playerIndex].commanderDamage[fromPlayerIndex] = Math.max(0, currentDamage + amount);
                setPlayers(newPlayers);
            };

            const updatePlayerName = (playerIndex, name) => {
                const newPlayers = [...players];
                newPlayers[playerIndex].name = name;
                setPlayers(newPlayers);
            };

            const resetGame = () => {
                if (confirm('Reset the game? This will clear all counters and history.')) {
                    setPlayers(players.map((p, i) => ({
                        name: p.name,
                        life: 40,
                        commanderDamage: {},
                        poison: 0,
                        energy: 0,
                        experience: 0
                    })));
                    setHistory([]);
                }
            };

            const toggleFullscreen = () => {
                const element = document.documentElement;
                
                if (!document.fullscreenElement &&
                    !document.webkitFullscreenElement &&
                    !document.mozFullScreenElement &&
                    !document.msFullscreenElement) {
                    // Enter fullscreen
                    if (element.requestFullscreen) {
                        element.requestFullscreen();
                    } else if (element.webkitRequestFullscreen) {
                        element.webkitRequestFullscreen();
                    } else if (element.mozRequestFullScreen) {
                        element.mozRequestFullScreen();
                    } else if (element.msRequestFullscreen) {
                        element.msRequestFullscreen();
                    }
                } else {
                    // Exit fullscreen
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            };

            const bgColor = darkMode ? 'glass-bg-dark' : 'glass-bg-light';
            const cardBg = darkMode ? 'bg-gray-800' : 'bg-white';
            const playerCardBg = darkMode ? 'glass-card-dark' : 'glass-card-light';
            const textColor = darkMode ? 'text-white' : 'text-gray-900';
            const textSecondary = darkMode ? 'text-gray-300' : 'text-gray-700';
            const borderColor = darkMode ? 'border-gray-700' : 'border-gray-300';
            const glassButton = darkMode ? 'glass-button-dark' : 'glass-button-light';
            const glassButtonBlue = darkMode ? 'glass-button-blue-dark' : 'glass-button-blue-light';
            const glassButtonRed = darkMode ? 'glass-button-red-dark' : 'glass-button-red-light';
            const glassButtonGreen = darkMode ? 'glass-button-green-dark' : 'glass-button-green-light';

            return (
                <div className={`h-full ${bgColor} ${textColor} transition-all duration-300 ease-out flex flex-col`}>
                    {/* Animated Background Layer */}
                    <div className={darkMode ? 'animated-bg-dark' : 'animated-bg-light'}></div>
                    
                    {/* Compact Header */}
                    <div className={`flex-shrink-0 px-2 py-2 ${darkMode ? 'glass-header-dark' : 'glass-header-light'} relative z-10`}>
                        <div className="flex justify-between items-center gap-2">
                            <h1 className="text-lg font-bold">MTG</h1>
                            <div className="flex items-center gap-1">
                                <Users size={16} />
                                {[2, 3, 4].map(num => (
                                    <button
                                        key={num}
                                        onClick={() => setNumPlayers(num)}
                                        className={`px-2 py-1 rounded text-xs ${textColor} ${
                                            numPlayers === num 
                                                ? `${glassButtonBlue} text-white` 
                                                : `${glassButton}`
                                        }`}
                                    >
                                        {num}
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-1">
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className={`p-1.5 rounded ${glassButton} ${textColor}`}
                                >
                                    {darkMode ? <Sun /> : <Moon />}
                                </button>
                                <button
                                    onClick={toggleFullscreen}
                                    className={`p-1.5 rounded ${glassButton} ${textColor}`}
                                >
                                    {isFullscreen ? <Minimize /> : <Maximize />}
                                </button>
                                <button
                                    onClick={undo}
                                    disabled={history.length === 0}
                                    className={`p-1.5 rounded ${glassButton} ${textColor} disabled:opacity-30 disabled:cursor-not-allowed`}
                                >
                                    <RotateCcw />
                                </button>
                                <button
                                    onClick={resetGame}
                                    className={`px-2 py-1.5 rounded ${glassButton} ${textColor} text-xs`}
                                >
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Players Table Layout - Takes remaining space */}
                    <div className="flex-1 overflow-hidden p-2 relative z-10">
                        <div className="h-full relative">
                            {players.map((player, playerIndex) => {
                                // Calculate positioning and sizing based on numPlayers and playerIndex
                                let positionStyle = {};
                                let widthStyle = {};
                                let transformStyle = '';
                                
                                if (numPlayers === 2) {
                                    // 2 players: Bottom (0) and Top (1) - each takes ~50% of width
                                    const width = 'calc(50% - 16px)';
                                    widthStyle = { width: width, maxWidth: '400px' };
                                    
                                    if (playerIndex === 0) {
                                        positionStyle = { bottom: '8px', left: '50%' };
                                        transformStyle = 'translateX(-50%) rotate(0deg)'; // Bottom faces up
                                    } else {
                                        positionStyle = { top: '8px', left: '50%' };
                                        transformStyle = 'translateX(-50%) rotate(180deg)'; // Top faces down
                                    }
                                } else if (numPlayers === 3) {
                                    // 3 players: Bottom (centered), Top-left and Top-right (evenly spaced)
                                    const width = 'calc(33.333% - 16px)';
                                    widthStyle = { width: width, maxWidth: '300px' };
                                    
                                    if (playerIndex === 0) {
                                        // Bottom player - centered
                                        positionStyle = { bottom: '8px', left: '50%' };
                                        transformStyle = 'translateX(-50%) rotate(0deg)'; // Bottom faces up
                                    } else if (playerIndex === 1) {
                                        // Top-left player - center at 25%
                                        positionStyle = { top: '8px', left: '25%' };
                                        transformStyle = 'translateX(-50%) rotate(180deg)'; // Top faces down
                                    } else {
                                        // Top-right player - center at 75%
                                        positionStyle = { top: '8px', left: '75%' };
                                        transformStyle = 'translateX(-50%) rotate(180deg)'; // Top faces down
                                    }
                                } else {
                                    // 4 players: Bottom, Top, Left, Right - equal space on each edge
                                    if (playerIndex === 0) {
                                        // Bottom player
                                        widthStyle = { width: 'calc(50% - 16px)', maxWidth: '400px' };
                                        positionStyle = { bottom: '8px', left: '50%' };
                                        transformStyle = 'translateX(-50%) rotate(0deg)'; // Bottom faces up
                                    } else if (playerIndex === 1) {
                                        // Top player
                                        widthStyle = { width: 'calc(50% - 16px)', maxWidth: '400px' };
                                        positionStyle = { top: '8px', left: '50%' };
                                        transformStyle = 'translateX(-50%) rotate(180deg)'; // Top faces down
                                    } else if (playerIndex === 2) {
                                        // Left player - width controls vertical dimension after rotation
                                        widthStyle = { width: 'calc(50% - 48px)', maxWidth: '300px', height: 'auto' };
                                        positionStyle = { left: '8px', top: '50%' };
                                        transformStyle = 'translateY(-50%) rotate(90deg)'; // Left faces right
                                    } else {
                                        // Right player - width controls vertical dimension after rotation
                                        widthStyle = { width: 'calc(50% - 48px)', maxWidth: '300px', height: 'auto' };
                                        positionStyle = { right: '8px', top: '50%' };
                                        transformStyle = 'translateY(-50%) rotate(-90deg)'; // Right faces left
                                    }
                                }
                                
                                return (
                                <div key={playerIndex} className={`absolute ${playerCardBg} rounded-lg p-3 flex flex-col overflow-hidden`} style={{ ...positionStyle, ...widthStyle, transform: transformStyle, transformOrigin: 'center' }}>
                                    {/* Player Name - Compact */}
                                    <input
                                        type="text"
                                        value={player.name}
                                        onChange={(e) => updatePlayerName(playerIndex, e.target.value)}
                                        className={`w-full text-sm font-bold mb-2 bg-transparent border-b ${borderColor} focus:outline-none pb-1`}
                                    />

                                    {/* Life Total - Compact */}
                                    <div className="mb-2">
                                        <div className="flex items-center justify-center gap-2">
                                            <button
                                                onClick={() => updateLife(playerIndex, -1)}
                                                className={`w-10 h-10 rounded-full ${glassButtonRed} text-white flex items-center justify-center text-xl font-bold`}
                                            >
                                                −
                                            </button>
                                            <div className={`text-4xl font-bold ${player.life <= 0 ? 'text-red-500' : ''}`}>
                                                {player.life}
                                            </div>
                                            <button
                                                onClick={() => updateLife(playerIndex, 1)}
                                                className={`w-10 h-10 rounded-full ${glassButtonGreen} text-white flex items-center justify-center text-xl font-bold`}
                                            >
                                                +
                                            </button>
                                        </div>
                                        <div className="flex gap-1 mt-1 justify-center">
                                            <button
                                                onClick={() => updateLife(playerIndex, -5)}
                                                className={`px-2 py-0.5 rounded ${glassButtonRed} text-white text-xs`}
                                            >
                                                -5
                                            </button>
                                            <button
                                                onClick={() => updateLife(playerIndex, 5)}
                                                className={`px-2 py-0.5 rounded ${glassButtonGreen} text-white text-xs`}
                                            >
                                                +5
                                            </button>
                                        </div>
                                    </div>

                                    {/* Counters - Compact */}
                                    <div className="space-y-1 text-xs mb-2">
                                        <CounterRow
                                            icon={<Skull size={12} />}
                                            label="Poison"
                                            value={player.poison}
                                            onDecrement={() => updateCounter(playerIndex, 'poison', -1)}
                                            onIncrement={() => updateCounter(playerIndex, 'poison', 1)}
                                            warning={player.poison >= 10}
                                            darkMode={darkMode}
                                        />
                                        <CounterRow
                                            icon={<Zap size={12} />}
                                            label="Energy"
                                            value={player.energy}
                                            onDecrement={() => updateCounter(playerIndex, 'energy', -1)}
                                            onIncrement={() => updateCounter(playerIndex, 'energy', 1)}
                                            darkMode={darkMode}
                                        />
                                        <CounterRow
                                            icon={<Award size={12} />}
                                            label="Exp"
                                            value={player.experience}
                                            onDecrement={() => updateCounter(playerIndex, 'experience', -1)}
                                            onIncrement={() => updateCounter(playerIndex, 'experience', 1)}
                                            darkMode={darkMode}
                                        />
                                    </div>

                                    {/* Commander Damage - Scrollable if needed */}
                                    <div className={`flex-1 overflow-auto pt-2 border-t ${borderColor}`}>
                                        <div className={`text-xs ${textSecondary} mb-1 flex items-center gap-1`}>
                                            <Droplet size={10} />
                                            Cmdr Dmg
                                        </div>
                                        <div className="space-y-1">
                                            {players.map((otherPlayer, otherIndex) => {
                                                if (otherIndex === playerIndex) return null;
                                                const damage = player.commanderDamage[otherIndex] || 0;
                                                return (
                                                    <div key={otherIndex} className="flex items-center justify-between text-xs">
                                                        <span className="truncate flex-1 text-xs">{otherPlayer.name}</span>
                                                        <div className="flex items-center gap-1">
                                                            <button
                                                                onClick={() => updateCommanderDamage(playerIndex, otherIndex, -1)}
                                                                className={`w-5 h-5 rounded ${glassButtonRed} text-white flex items-center justify-center text-xs`}
                                                            >
                                                                −
                                                            </button>
                                                            <span className={`w-6 text-center font-bold text-xs ${damage >= 21 ? 'text-red-500' : ''}`}>
                                                                {damage}
                                                            </span>
                                                            <button
                                                                onClick={() => updateCommanderDamage(playerIndex, otherIndex, 1)}
                                                                className={`w-5 h-5 rounded ${glassButtonGreen} text-white flex items-center justify-center text-xs`}
                                                            >
                                                                +
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function CounterRow({ icon, label, value, onDecrement, onIncrement, warning, darkMode }) {
            const glassButton = darkMode ? 'glass-button-dark' : 'glass-button-light';
            const textColor = darkMode ? 'text-white' : 'text-gray-900';
            
            return (
                <div className="flex items-center justify-between">
                    <div className="flex items-center gap-1">
                        {icon}
                        <span className="text-xs">{label}</span>
                    </div>
                    <div className="flex items-center gap-1">
                        <button
                            onClick={onDecrement}
                            className={`w-5 h-5 rounded ${glassButton} ${textColor} flex items-center justify-center text-xs`}
                        >
                            −
                        </button>
                        <span className={`w-6 text-center font-bold text-xs ${warning ? 'text-red-500' : ''}`}>
                            {value}
                        </span>
                        <button
                            onClick={onIncrement}
                            className={`w-5 h-5 rounded ${glassButton} ${textColor} flex items-center justify-center text-xs`}
                        >
                            +
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MTGLifeCounter />, document.getElementById('root'));
    </script>
</body>
</html>
