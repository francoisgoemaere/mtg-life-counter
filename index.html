<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTG Life Counter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; }
      html, body, #root { height: 100%; width: 100%; }
      
      /* Animated Particle/Bubble Background */
      .animated-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
      }
      
      .bubble {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
        animation: float linear infinite;
        opacity: 0.4;
      }
      
      .bubble-dark {
        background: radial-gradient(circle at 30% 30%, rgba(147, 197, 253, 0.2), rgba(59, 130, 246, 0.1));
      }
      
      @keyframes float {
        0% {
          transform: translateY(100vh) translateX(0) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 0.4;
        }
        90% {
          opacity: 0.4;
        }
        100% {
          transform: translateY(-100px) translateX(100px) scale(1);
          opacity: 0;
        }
      }
      
      /* Glassmorphism Button Styles */
      .glass-button {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        transition: all 0.2s ease;
      }
      
      .glass-button-dark {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }
      
      .glass-button-light {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(255, 255, 255, 0.5);
      }
      
      .glass-button:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }
      
      .glass-button-light:hover {
        background: rgba(255, 255, 255, 0.85);
        border-color: rgba(255, 255, 255, 0.6);
      }
      
      .glass-button:active {
        transform: translateY(0);
      }
      
      /* Colored glass buttons for life counters */
      .glass-button-red {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        background: rgba(220, 38, 38, 0.4);
        border: 1px solid rgba(220, 38, 38, 0.3);
      }
      
      .glass-button-red:hover {
        background: rgba(220, 38, 38, 0.5);
        border-color: rgba(220, 38, 38, 0.4);
      }
      
      .glass-button-green {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        background: rgba(34, 197, 94, 0.4);
        border: 1px solid rgba(34, 197, 94, 0.3);
      }
      
      .glass-button-green:hover {
        background: rgba(34, 197, 94, 0.5);
        border-color: rgba(34, 197, 94, 0.4);
      }
      
      /* Colored hover effects for +/-5 and commander damage buttons */
      .glass-button-hover-red:hover {
        background: rgba(220, 38, 38, 0.4) !important;
        border-color: rgba(220, 38, 38, 0.3) !important;
        color: white !important;
      }
      
      .glass-button-hover-green:hover {
        background: rgba(34, 197, 94, 0.4) !important;
        border-color: rgba(34, 197, 94, 0.3) !important;
        color: white !important;
      }
      
      /* Content layer */
      .content-layer {
        position: relative;
        z-index: 1;
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide icons as inline SVG components
        const Moon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        );

        const Sun = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        );

        const RotateCcw = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
        );

        const Users = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const Skull = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="9" cy="12" r="1"></circle>
                <circle cx="15" cy="12" r="1"></circle>
                <path d="M8 20v2h8v-2"></path>
                <path d="M12.5 17-.5.5a1 1 0 0 0-1 0l-.5.5"></path>
                <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path>
            </svg>
        );

        const Zap = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
        );

        const Award = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="8" r="7"></circle>
                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </svg>
        );

        const Droplet = ({ size = 14 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
        );

        function AnimatedBackground({ darkMode }) {
            const [bubbles, setBubbles] = useState([]);

            useEffect(() => {
                const bubbleCount = 20;
                const newBubbles = Array.from({ length: bubbleCount }, (_, i) => ({
                    id: i,
                    size: Math.random() * 80 + 40,
                    left: Math.random() * 100,
                    duration: Math.random() * 20 + 15,
                    delay: Math.random() * 5,
                }));
                setBubbles(newBubbles);
            }, []);

            return (
                <div className="animated-background">
                    {bubbles.map(bubble => (
                        <div
                            key={bubble.id}
                            className={`bubble ${darkMode ? 'bubble-dark' : ''}`}
                            style={{
                                width: `${bubble.size}px`,
                                height: `${bubble.size}px`,
                                left: `${bubble.left}%`,
                                animationDuration: `${bubble.duration}s`,
                                animationDelay: `${bubble.delay}s`,
                            }}
                        />
                    ))}
                </div>
            );
        }

        function MTGLifeCounter() {
            const [darkMode, setDarkMode] = useState(true);
            const [numPlayers, setNumPlayers] = useState(2);
            const [history, setHistory] = useState([]);
            const [players, setPlayers] = useState([
                { 
                    name: 'Player 1', 
                    life: 40, 
                    commanderDamage: {},
                    poison: 0,
                    energy: 0,
                    experience: 0
                },
                { 
                    name: 'Player 2', 
                    life: 40, 
                    commanderDamage: {},
                    poison: 0,
                    energy: 0,
                    experience: 0
                }
            ]);

            useEffect(() => {
                const newPlayers = Array(numPlayers).fill(null).map((_, i) => {
                    if (players[i]) return players[i];
                    return {
                        name: `Player ${i + 1}`,
                        life: 40,
                        commanderDamage: {},
                        poison: 0,
                        energy: 0,
                        experience: 0
                    };
                });
                setPlayers(newPlayers);
            }, [numPlayers]);

            const saveHistory = () => {
                setHistory([...history, JSON.parse(JSON.stringify(players))]);
            };

            const undo = () => {
                if (history.length > 0) {
                    const previous = history[history.length - 1];
                    setPlayers(previous);
                    setHistory(history.slice(0, -1));
                }
            };

            const updateLife = (playerIndex, amount) => {
                saveHistory();
                const newPlayers = [...players];
                newPlayers[playerIndex].life += amount;
                setPlayers(newPlayers);
            };

            const updateCounter = (playerIndex, counterType, amount) => {
                saveHistory();
                const newPlayers = [...players];
                newPlayers[playerIndex][counterType] = Math.max(0, newPlayers[playerIndex][counterType] + amount);
                setPlayers(newPlayers);
            };

            const updateCommanderDamage = (playerIndex, fromPlayerIndex, amount) => {
                saveHistory();
                const newPlayers = [...players];
                const currentDamage = newPlayers[playerIndex].commanderDamage[fromPlayerIndex] || 0;
                newPlayers[playerIndex].commanderDamage[fromPlayerIndex] = Math.max(0, currentDamage + amount);
                setPlayers(newPlayers);
            };

            const updatePlayerName = (playerIndex, name) => {
                const newPlayers = [...players];
                newPlayers[playerIndex].name = name;
                setPlayers(newPlayers);
            };

            const resetGame = () => {
                if (confirm('Reset the game? This will clear all counters and history.')) {
                    setPlayers(players.map((p, i) => ({
                        name: p.name,
                        life: 40,
                        commanderDamage: {},
                        poison: 0,
                        energy: 0,
                        experience: 0
                    })));
                    setHistory([]);
                }
            };

            const bgColor = darkMode ? 'bg-gray-900' : 'bg-gray-100';
            const cardBg = darkMode ? 'bg-gray-800' : 'bg-white';
            const textColor = darkMode ? 'text-white' : 'text-gray-900';
            const textSecondary = darkMode ? 'text-gray-400' : 'text-gray-600';
            const borderColor = darkMode ? 'border-gray-700' : 'border-gray-300';

            return (
                <div className={`h-full ${bgColor} ${textColor} transition-colors duration-200 flex flex-col relative`}>
                    <AnimatedBackground darkMode={darkMode} />
                    <div className="content-layer h-full flex flex-col">
                    {/* Compact Header */}
                    <div className="flex-shrink-0 px-2 py-2 border-b border-gray-700">
                        <div className="flex justify-between items-center gap-2">
                            <h1 className="text-lg font-bold">MTG</h1>
                            <div className="flex items-center gap-1">
                                <Users size={16} />
                                {[2, 3, 4].map(num => (
                                    <button
                                        key={num}
                                        onClick={() => setNumPlayers(num)}
                                        className={`px-2 py-1 rounded text-xs glass-button ${
                                            darkMode ? 'glass-button-dark' : 'glass-button-light'
                                        } ${
                                            numPlayers === num 
                                                ? 'bg-blue-600 bg-opacity-60 text-white border-blue-400 border-opacity-40' 
                                                : ''
                                        }`}
                                    >
                                        {num}
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-1">
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className={`p-1.5 rounded glass-button ${
                                        darkMode ? 'glass-button-dark' : 'glass-button-light'
                                    }`}
                                >
                                    {darkMode ? <Sun /> : <Moon />}
                                </button>
                                <button
                                    onClick={undo}
                                    disabled={history.length === 0}
                                    className={`p-1.5 rounded glass-button ${
                                        darkMode ? 'glass-button-dark' : 'glass-button-light'
                                    } disabled:opacity-30`}
                                >
                                    <RotateCcw />
                                </button>
                                <button
                                    onClick={resetGame}
                                    className={`px-2 py-1.5 rounded glass-button text-xs ${
                                        darkMode ? 'glass-button-dark' : 'glass-button-light'
                                    }`}
                                >
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Players Grid - Takes remaining space */}
                    <div className="flex-1 overflow-hidden p-2">
                        <div className={`h-full grid gap-2 ${
                            numPlayers === 2 ? 'grid-cols-1 sm:grid-cols-2' : 
                            numPlayers === 3 ? 'grid-cols-1 sm:grid-cols-3' : 
                            'grid-cols-2 sm:grid-cols-4'
                        }`}>
                            {players.map((player, playerIndex) => (
                                <div key={playerIndex} className={`${cardBg} rounded-lg p-3 border ${borderColor} flex flex-col overflow-hidden`}>
                                    {/* Player Name - Compact */}
                                    <input
                                        type="text"
                                        value={player.name}
                                        onChange={(e) => updatePlayerName(playerIndex, e.target.value)}
                                        className={`w-full text-sm font-bold mb-2 bg-transparent border-b ${borderColor} focus:outline-none pb-1`}
                                    />

                                    {/* Life Total - Compact */}
                                    <div className="mb-2">
                                        <div className="flex items-center justify-center gap-2">
                                            <button
                                                onClick={() => updateLife(playerIndex, -1)}
                                                className="w-10 h-10 rounded-full glass-button-red text-white flex items-center justify-center text-xl font-bold"
                                            >
                                                −
                                            </button>
                                            <div className={`text-4xl font-bold ${player.life <= 0 ? 'text-red-500' : ''}`}>
                                                {player.life}
                                            </div>
                                            <button
                                                onClick={() => updateLife(playerIndex, 1)}
                                                className="w-10 h-10 rounded-full glass-button-green text-white flex items-center justify-center text-xl font-bold"
                                            >
                                                +
                                            </button>
                                        </div>
                                        <div className="flex gap-1 mt-1 justify-center">
                                            <button
                                                onClick={() => updateLife(playerIndex, -5)}
                                                className={`px-2 py-0.5 rounded glass-button text-xs glass-button-hover-red ${
                                                    darkMode ? 'glass-button-dark' : 'glass-button-light'
                                                }`}
                                            >
                                                -5
                                            </button>
                                            <button
                                                onClick={() => updateLife(playerIndex, 5)}
                                                className={`px-2 py-0.5 rounded glass-button text-xs glass-button-hover-green ${
                                                    darkMode ? 'glass-button-dark' : 'glass-button-light'
                                                }`}
                                            >
                                                +5
                                            </button>
                                        </div>
                                    </div>

                                    {/* Counters - Compact */}
                                    <div className="space-y-1 text-xs mb-2">
                                        <CounterRow
                                            icon={<Skull size={12} />}
                                            label="Poison"
                                            value={player.poison}
                                            onDecrement={() => updateCounter(playerIndex, 'poison', -1)}
                                            onIncrement={() => updateCounter(playerIndex, 'poison', 1)}
                                            warning={player.poison >= 10}
                                            darkMode={darkMode}
                                        />
                                        <CounterRow
                                            icon={<Zap size={12} />}
                                            label="Energy"
                                            value={player.energy}
                                            onDecrement={() => updateCounter(playerIndex, 'energy', -1)}
                                            onIncrement={() => updateCounter(playerIndex, 'energy', 1)}
                                            darkMode={darkMode}
                                        />
                                        <CounterRow
                                            icon={<Award size={12} />}
                                            label="Exp"
                                            value={player.experience}
                                            onDecrement={() => updateCounter(playerIndex, 'experience', -1)}
                                            onIncrement={() => updateCounter(playerIndex, 'experience', 1)}
                                            darkMode={darkMode}
                                        />
                                    </div>

                                    {/* Commander Damage - Scrollable if needed */}
                                    <div className={`flex-1 overflow-auto pt-2 border-t ${borderColor}`}>
                                        <div className={`text-xs ${textSecondary} mb-1 flex items-center gap-1`}>
                                            <Droplet size={10} />
                                            Cmdr Dmg
                                        </div>
                                        <div className="space-y-1">
                                            {players.map((otherPlayer, otherIndex) => {
                                                if (otherIndex === playerIndex) return null;
                                                const damage = player.commanderDamage[otherIndex] || 0;
                                                return (
                                                    <div key={otherIndex} className="flex items-center justify-between text-xs">
                                                        <span className="truncate flex-1 text-xs">{otherPlayer.name}</span>
                                                        <div className="flex items-center gap-1">
                                                            <button
                                                                onClick={() => updateCommanderDamage(playerIndex, otherIndex, -1)}
                                                                className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center glass-button-hover-red ${
                                                                    darkMode ? 'glass-button-dark' : 'glass-button-light'
                                                                }`}
                                                            >
                                                                −
                                                            </button>
                                                            <span className={`w-6 text-center font-bold text-xs ${damage >= 21 ? 'text-red-500' : ''}`}>
                                                                {damage}
                                                            </span>
                                                            <button
                                                                onClick={() => updateCommanderDamage(playerIndex, otherIndex, 1)}
                                                                className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center glass-button-hover-green ${
                                                                    darkMode ? 'glass-button-dark' : 'glass-button-light'
                                                                }`}
                                                            >
                                                                +
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    </div>
                </div>
            );
        }

        function CounterRow({ icon, label, value, onDecrement, onIncrement, warning, darkMode }) {
            return (
                <div className="flex items-center justify-between">
                    <div className="flex items-center gap-1">
                        {icon}
                        <span className="text-xs">{label}</span>
                    </div>
                    <div className="flex items-center gap-1">
                        <button
                            onClick={onDecrement}
                            className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center ${
                                darkMode ? 'glass-button-dark' : 'glass-button-light'
                            }`}
                        >
                            −
                        </button>
                        <span className={`w-6 text-center font-bold text-xs ${warning ? 'text-red-500' : ''}`}>
                            {value}
                        </span>
                        <button
                            onClick={onIncrement}
                            className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center ${
                                darkMode ? 'glass-button-dark' : 'glass-button-light'
                            }`}
                        >
                            +
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MTGLifeCounter />, document.getElementById('root'));
    </script>
</body>
</html>
