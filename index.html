<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111827" id="theme-color-meta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MTG Life Counter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      
      body { 
        margin: 0; 
        padding: 0; 
        overflow: hidden;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        background-color: #111827;
        transition: background-color 0.2s;
      }
      
      html, body, #root { 
        height: 100%; 
        width: 100%; 
      }
      
      /* Animated Gradient Orbs and Curvy Lines Background */
      .animated-background {
        position: fixed;
        top: calc(-1 * env(safe-area-inset-top, 0px));
        left: calc(-1 * env(safe-area-inset-left, 0px));
        right: calc(-1 * env(safe-area-inset-right, 0px));
        bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
        width: calc(100% + env(safe-area-inset-left, 0px) + env(safe-area-inset-right, 0px));
        height: calc(100% + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
        z-index: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #3b82f6 0%, #ec4899 15%, #60a5fa 30%, #f472b6 45%, #06b6d4 60%, #ec4899 75%, #0ea5e9 90%, #00f2fe 100%);
        background-size: 400% 400%;
        animation: gradientShift 20s ease infinite;
      }
      
      .animated-background-dark {
        background: linear-gradient(135deg, #1e40af 0%, #be185d 15%, #3b82f6 30%, #ec4899 45%, #2563eb 60%, #be185d 75%, #0ea5e9 85%, #06b6d4 95%, #0891b2 100%);
        background-size: 400% 400%;
      }
      
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        animation: floatOrb linear infinite;
      }
      
      .orb-1 {
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.9), rgba(59, 130, 246, 0));
        top: -100px;
        left: -100px;
        animation-duration: 25s;
      }
      
      .orb-2 {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.85), rgba(236, 72, 153, 0));
        bottom: -100px;
        right: -100px;
        animation-duration: 30s;
        animation-delay: -5s;
      }
      
      .orb-3 {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.9), rgba(37, 99, 235, 0));
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-duration: 35s;
        animation-delay: -10s;
      }
      
      .orb-4 {
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.85), rgba(14, 165, 233, 0));
        top: 20%;
        right: 10%;
        animation-duration: 28s;
        animation-delay: -15s;
      }
      
      .orb-5 {
        width: 340px;
        height: 340px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.85), rgba(6, 182, 212, 0));
        bottom: 20%;
        left: 10%;
        animation-duration: 32s;
        animation-delay: -20s;
      }
      
      .orb-6 {
        width: 360px;
        height: 360px;
        background: radial-gradient(circle, rgba(244, 114, 182, 0.8), rgba(244, 114, 182, 0));
        top: 70%;
        left: 60%;
        animation-duration: 27s;
        animation-delay: -12s;
      }
      
      /* Waving Curvy Color Lines */
      .wave-line {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0.7;
        mix-blend-mode: screen;
        transform-origin: center center;
      }
      
      .wave-line-dark {
        mix-blend-mode: screen;
        opacity: 0.6;
      }
      
      .wave-line svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 2px currentColor);
      }
      
      .wave-line-dark svg {
        filter: drop-shadow(0 0 3px currentColor);
      }
      
      
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      
      @keyframes floatOrb {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 0.5;
        }
        33% {
          transform: translate(30px, -50px) scale(1.1);
          opacity: 0.6;
        }
        66% {
          transform: translate(-20px, 30px) scale(0.9);
          opacity: 0.4;
        }
        100% {
          transform: translate(0, 0) scale(1);
          opacity: 0.5;
        }
      }
      
      
      /* Glassmorphism Button Styles */
      .glass-button {
        backdrop-filter: blur(50px) saturate(250%) brightness(1.1);
        -webkit-backdrop-filter: blur(50px) saturate(250%) brightness(1.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 
          0 8px 32px 0 rgba(0, 0, 0, 0.1),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.05);
      }
      
      .glass-button-dark {
        backdrop-filter: blur(50px) saturate(250%) brightness(0.95);
        -webkit-backdrop-filter: blur(50px) saturate(250%) brightness(0.95);
        background: rgba(0, 0, 0, 0.2);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 8px 32px 0 rgba(0, 0, 0, 0.4),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.12),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.2);
      }
      
      .glass-button-light {
        backdrop-filter: blur(50px) saturate(250%) brightness(1.15);
        -webkit-backdrop-filter: blur(50px) saturate(250%) brightness(1.15);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 
          0 8px 32px 0 rgba(0, 0, 0, 0.08),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.4),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.03);
      }
      
      .glass-button:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.25);
        transform: translateY(-1px);
        box-shadow: 
          0 12px 40px 0 rgba(0, 0, 0, 0.15),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.4),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.08);
      }
      
      .glass-button-light:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 
          0 12px 40px 0 rgba(0, 0, 0, 0.12),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.45),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.05);
      }
      
      .glass-button:active {
        transform: translateY(0);
      }
      
      /* Colored glass buttons for life counters */
      .glass-button-red {
        backdrop-filter: blur(50px) saturate(250%) brightness(1.1);
        -webkit-backdrop-filter: blur(50px) saturate(250%) brightness(1.1);
        background: rgba(220, 38, 38, 0.25);
        border: 1px solid rgba(220, 38, 38, 0.3);
        box-shadow: 
          0 8px 32px 0 rgba(220, 38, 38, 0.2),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.1);
      }
      
      .glass-button-red:hover {
        background: rgba(220, 38, 38, 0.35);
        border-color: rgba(220, 38, 38, 0.4);
        box-shadow: 
          0 12px 40px 0 rgba(220, 38, 38, 0.3),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.4),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.15);
      }
      
      .glass-button-green {
        backdrop-filter: blur(50px) saturate(250%) brightness(1.1);
        -webkit-backdrop-filter: blur(50px) saturate(250%) brightness(1.1);
        background: rgba(34, 197, 94, 0.25);
        border: 1px solid rgba(34, 197, 94, 0.3);
        box-shadow: 
          0 8px 32px 0 rgba(34, 197, 94, 0.2),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.1);
      }
      
      .glass-button-green:hover {
        background: rgba(34, 197, 94, 0.35);
        border-color: rgba(34, 197, 94, 0.4);
        box-shadow: 
          0 12px 40px 0 rgba(34, 197, 94, 0.3),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.4),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.15);
      }
      
      /* Colored hover effects for +/-5 and commander damage buttons */
      .glass-button-hover-red:hover {
        backdrop-filter: blur(50px) saturate(250%) brightness(1.1) !important;
        -webkit-backdrop-filter: blur(50px) saturate(250%) brightness(1.1) !important;
        background: rgba(220, 38, 38, 0.3) !important;
        border-color: rgba(220, 38, 38, 0.35) !important;
        color: white !important;
        box-shadow: 
          0 8px 32px 0 rgba(220, 38, 38, 0.25),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.1) !important;
      }
      
      .glass-button-hover-green:hover {
        backdrop-filter: blur(50px) saturate(250%) brightness(1.1) !important;
        -webkit-backdrop-filter: blur(50px) saturate(250%) brightness(1.1) !important;
        background: rgba(34, 197, 94, 0.3) !important;
        border-color: rgba(34, 197, 94, 0.35) !important;
        color: white !important;
        box-shadow: 
          0 8px 32px 0 rgba(34, 197, 94, 0.25),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.1) !important;
      }
      
      /* Content layer */
      .content-layer {
        position: relative;
        z-index: 1;
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // ============================================================================
        // CONSTANTS
        // ============================================================================
        const DEFAULT_LIFE = 40;
        const POISON_WIN_THRESHOLD = 10;
        const COMMANDER_DAMAGE_THRESHOLD = 21;
        const LIFE_CHANGE_AMOUNTS = {
            SMALL: 1,
            LARGE: 5
        };
        const SUPPORTED_PLAYER_COUNTS = [2, 3, 4];

        // ============================================================================
        // ICON COMPONENTS
        // ============================================================================
        const Moon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        );

        const Sun = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        );

        const RotateCcw = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
        );

        const Users = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const Skull = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="9" cy="12" r="1"></circle>
                <circle cx="15" cy="12" r="1"></circle>
                <path d="M8 20v2h8v-2"></path>
                <path d="M12.5 17-.5.5a1 1 0 0 0-1 0l-.5.5"></path>
                <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path>
            </svg>
        );

        const Zap = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
        );

        const Award = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="8" r="7"></circle>
                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </svg>
        );

        const Droplet = ({ size = 14 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
        );

        // ============================================================================
        // UTILITY FUNCTIONS
        // ============================================================================
        const createPlayer = (index) => ({
            name: `Player ${index + 1}`,
            life: DEFAULT_LIFE,
            commanderDamage: {},
            poison: 0,
            energy: 0,
            experience: 0
        });

        const deepClone = (obj) => JSON.parse(JSON.stringify(obj));

        const getThemeClasses = (darkMode) => ({
            bg: darkMode ? 'bg-gray-900' : 'bg-gray-100',
            card: darkMode ? 'bg-gray-800' : 'bg-white',
            text: darkMode ? 'text-white' : 'text-gray-900',
            textSecondary: darkMode ? 'text-gray-400' : 'text-gray-600',
            border: darkMode ? 'border-gray-700' : 'border-gray-300',
            glassButton: darkMode ? 'glass-button-dark' : 'glass-button-light'
        });

        const getGridClasses = (numPlayers) => {
            if (numPlayers === 2) return 'grid-cols-1 sm:grid-cols-2';
            if (numPlayers === 3) return 'grid-cols-1 sm:grid-cols-3';
            return 'grid-cols-2 sm:grid-cols-4';
        };

        // ============================================================================
        // MORPHING PATH HOOK
        // ============================================================================
        const lerp = (a, b, t) => a + (b - a) * t;
        const smoothstep = (t) => t * t * (3 - 2 * t);
        const fract = (x) => x - Math.floor(x);
        const hash1D = (x) => fract(Math.sin(x) * 43758.5453123);
        const valueNoise1D = (x) => {
            const x0 = Math.floor(x);
            const x1 = x0 + 1;
            const t = smoothstep(x - x0);
            const v0 = hash1D(x0);
            const v1 = hash1D(x1);
            return lerp(v0, v1, t) * 2 - 1;
        };
        const layeredNoise1D = (x, y, mix = 0.75) => {
            const n1 = valueNoise1D(x);
            const n2 = valueNoise1D(y);
            const blended = n1 * mix + n2 * (1 - mix);
            const normalized = (blended + 1) / 2;
            const softened = smoothstep(normalized);
            return softened * 2 - 1;
        };

        function useMorphingPath({ 
            width = 1200, 
            height = 200, 
            baseY = 100, 
            amplitude = 60, 
            frequency = 0.002, 
            phaseOffset = 0,
            segments = 8 
        }) {
            const [pathData, setPathData] = useState('');

            useEffect(() => {
                let animationFrameId;
                let startTime = Date.now();

                const generatePath = (timeMs) => {
                    const path = [];
                    const segmentWidth = width / segments;
                    const time = timeMs * 0.00025;
                    
                    // Start point
                    path.push(`M 0,${baseY}`);
                    
                    // Generate cubic bezier curves for each segment
                    for (let i = 0; i < segments; i++) {
                        const x1 = i * segmentWidth;
                        const x2 = (i + 0.5) * segmentWidth;
                        const x3 = (i + 1) * segmentWidth;
                        
                        // Noise-driven control points for more organic motion
                        const n1 = layeredNoise1D(
                            x1 * frequency + time + phaseOffset,
                            x1 * frequency * 2.3 + time * 1.3 + phaseOffset + 9.7,
                            0.75
                        );
                        const n2 = layeredNoise1D(
                            x2 * frequency + time + phaseOffset + 1.2,
                            x2 * frequency * 2.1 + time * 1.1 + phaseOffset + 12.4,
                            0.7
                        );
                        const n3 = layeredNoise1D(
                            x3 * frequency + time + phaseOffset + 2.4,
                            x3 * frequency * 2.5 + time * 1.4 + phaseOffset + 15.1,
                            0.72
                        );
                        const wave1 = n1 * amplitude;
                        const wave2 = n2 * amplitude * 0.9;
                        const wave3 = n3 * amplitude;
                        
                        // Control point 1 (before the curve)
                        const cp1x = x1 + segmentWidth * 0.3;
                        const cp1y = baseY + wave1;
                        
                        // Control point 2 (after the curve)
                        const cp2x = x1 + segmentWidth * 0.7;
                        const cp2y = baseY + wave2;
                        
                        // End point
                        const endX = x3;
                        const endY = baseY + wave3;
                        
                        // Add cubic bezier curve
                        path.push(`C ${cp1x},${cp1y} ${cp2x},${cp2y} ${endX},${endY}`);
                    }
                    
                    return path.join(' ');
                };

                const animate = () => {
                    const currentTime = Date.now() - startTime;
                    const newPath = generatePath(currentTime);
                    setPathData(newPath);
                    animationFrameId = requestAnimationFrame(animate);
                };

                // Initialize with first frame
                const initialPath = generatePath(0);
                setPathData(initialPath);
                
                // Start animation
                animationFrameId = requestAnimationFrame(animate);

                return () => {
                    if (animationFrameId) {
                        cancelAnimationFrame(animationFrameId);
                    }
                };
            }, [width, height, baseY, amplitude, frequency, phaseOffset, segments]);

            return pathData;
        }

        // ============================================================================
        // RANDOM TRANSFORM HOOK
        // ============================================================================
        function useRandomTransform({
            speedX = 0.0003,
            speedY = 0.0004,
            speedRotation = 0.00025,
            phaseOffsetX = 0,
            phaseOffsetY = 0,
            phaseOffsetRotation = 0
        } = {}) {
            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            const [transformValues, setTransformValues] = useState({
                translateX: '0%',
                translateY: '0%',
                rotate: '0deg'
            });

            useEffect(() => {
                let animationFrameId;
                let startTime = Date.now();

                const animate = () => {
                    const currentTime = Date.now() - startTime;
                    
                    // Noise-driven drift for gentler, organic motion
                    const tX1 = currentTime * speedX + phaseOffsetX;
                    const tX2 = currentTime * speedX * 0.8 + phaseOffsetX + 11.1;
                    const translateX = clamp(layeredNoise1D(tX1, tX2, 0.7) * 18, -14, 14);
                    
                    const tY1 = currentTime * speedY + phaseOffsetY;
                    const tY2 = currentTime * speedY * 0.85 + phaseOffsetY + 17.4;
                    const translateY = clamp(layeredNoise1D(tY1, tY2, 0.7) * 18, -14, 14);
                    
                    const rotate = (currentTime * speedRotation) + (phaseOffsetRotation * (180 / Math.PI));
                    
                    setTransformValues({
                        translateX: `${translateX}%`,
                        translateY: `${translateY}%`,
                        rotate: `${rotate}deg`
                    });
                    
                    animationFrameId = requestAnimationFrame(animate);
                };

                // Start animation
                animationFrameId = requestAnimationFrame(animate);

                return () => {
                    if (animationFrameId) {
                        cancelAnimationFrame(animationFrameId);
                    }
                };
            }, [speedX, speedY, speedRotation, phaseOffsetX, phaseOffsetY, phaseOffsetRotation]);

            return {
                transform: `translate(${transformValues.translateX}, ${transformValues.translateY}) rotate(${transformValues.rotate})`
            };
        }

        // ============================================================================
        // ANIMATED BACKGROUND COMPONENT
        // ============================================================================
        function AnimatedBackground({ darkMode }) {
            // Generate morphing paths for each wave line with unique parameters
            // Line 1: Medium amplitude, medium frequency - smooth flowing waves
            const path1 = useMorphingPath({
                width: 1200,
                height: 200,
                baseY: 100,
                amplitude: 18,
                frequency: 0.0003,
                phaseOffset: 0.3,
                segments: 8
            });
            
            // Line 2: High amplitude, slow frequency - dramatic sweeping curves
            const path2 = useMorphingPath({
                width: 1200,
                height: 200,
                baseY: 100,
                amplitude: 20,
                frequency: 0.00038,
                phaseOffset: Math.PI * 0.47,
                segments: 7
            });
            
            // Line 3: Low amplitude, fast frequency - subtle quick ripples
            const path3 = useMorphingPath({
                width: 1200,
                height: 200,
                baseY: 100,
                amplitude: 12,
                frequency: 0.00032,
                phaseOffset: Math.PI * 0.73,
                segments: 8
            });
            
            // Line 4: Medium-high amplitude, medium-slow frequency - flowing waves
            const path4 = useMorphingPath({
                width: 1200,
                height: 200,
                baseY: 100,
                amplitude: 18,
                frequency: 0.0004,
                phaseOffset: Math.PI * 1.23,
                segments: 7
            });
            
            // Line 5: Very high amplitude, very slow frequency - dramatic long curves
            const path5 = useMorphingPath({
                width: 1200,
                height: 200,
                baseY: 100,
                amplitude: 22,
                frequency: 0.00034,
                phaseOffset: Math.PI * 1.67,
                segments: 6
            });
            
            // Line 6: Low-medium amplitude, fast frequency - quick subtle waves
            const path6 = useMorphingPath({
                width: 1200,
                height: 200,
                baseY: 100,
                amplitude: 14,
                frequency: 0.00042,
                phaseOffset: Math.PI * 2.41,
                segments: 8
            });

            // Line 7: Medium amplitude, slower frequency - smooth drifting waves
            const path7 = useMorphingPath({
                width: 1200,
                height: 200,
                baseY: 100,
                amplitude: 16,
                frequency: 0.00028,

            const transform10 = useRandomTransform({

            const transform11 = useRandomTransform({

        // ============================================================================
        // COUNTER ROW COMPONENT
        // ============================================================================
        function CounterRow({ icon, label, value, onDecrement, onIncrement, warning, darkMode }) {
            const theme = getThemeClasses(darkMode);
            
            return (
                <div className="flex items-center justify-between">
                    <div className="flex items-center gap-1">
                        {icon}
                        <span className="text-xs">{label}</span>
                    </div>
                    <div className="flex items-center gap-1">
                        <button
                            onClick={onDecrement}
                            className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center ${theme.glassButton}`}
                        >
                            −
                        </button>
                        <span className={`w-6 text-center font-bold text-xs ${warning ? 'text-red-500' : ''}`}>
                            {value}
                        </span>
                        <button
                            onClick={onIncrement}
                            className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center ${theme.glassButton}`}
                        >
                            +
                        </button>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // LIFE COUNTER COMPONENT
        // ============================================================================
        function LifeCounter({ player, playerIndex, onUpdateLife, darkMode }) {
            const theme = getThemeClasses(darkMode);
            const isDead = player.life <= 0;

            return (
                <div className="mb-2">
                    <div className="flex items-center justify-center gap-2">
                        <button
                            onClick={() => onUpdateLife(playerIndex, -LIFE_CHANGE_AMOUNTS.SMALL)}
                            className="w-10 h-10 rounded-full glass-button-red text-white flex items-center justify-center text-xl font-bold"
                        >
                            −
                        </button>
                        <div className={`text-4xl font-bold ${isDead ? 'text-red-500' : ''}`}>
                            {player.life}
                        </div>
                        <button
                            onClick={() => onUpdateLife(playerIndex, LIFE_CHANGE_AMOUNTS.SMALL)}
                            className="w-10 h-10 rounded-full glass-button-green text-white flex items-center justify-center text-xl font-bold"
                        >
                            +
                        </button>
                    </div>
                    <div className="flex gap-1 mt-1 justify-center">
                        <button
                            onClick={() => onUpdateLife(playerIndex, -LIFE_CHANGE_AMOUNTS.LARGE)}
                            className={`px-2 py-0.5 rounded glass-button text-xs glass-button-hover-red ${theme.glassButton}`}
                        >
                            -5
                        </button>
                        <button
                            onClick={() => onUpdateLife(playerIndex, LIFE_CHANGE_AMOUNTS.LARGE)}
                            className={`px-2 py-0.5 rounded glass-button text-xs glass-button-hover-green ${theme.glassButton}`}
                        >
                            +5
                        </button>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // COMMANDER DAMAGE COMPONENT
        // ============================================================================
        function CommanderDamage({ player, playerIndex, allPlayers, onUpdateCommanderDamage, darkMode }) {
            const theme = getThemeClasses(darkMode);

            return (
                <div className={`flex-1 overflow-auto pt-2 border-t ${theme.border}`}>
                    <div className={`text-xs ${theme.textSecondary} mb-1 flex items-center gap-1`}>
                        <Droplet size={10} />
                        Cmdr Dmg
                    </div>
                    <div className="space-y-1">
                        {allPlayers.map((otherPlayer, otherIndex) => {
                            if (otherIndex === playerIndex) return null;
                            const damage = player.commanderDamage[otherIndex] || 0;
                            const isLethal = damage >= COMMANDER_DAMAGE_THRESHOLD;
                            
                            return (
                                <div key={otherIndex} className="flex items-center justify-between text-xs">
                                    <span className="truncate flex-1 text-xs">{otherPlayer.name}</span>
                                    <div className="flex items-center gap-1">
                                        <button
                                            onClick={() => onUpdateCommanderDamage(playerIndex, otherIndex, -1)}
                                            className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center glass-button-hover-red ${theme.glassButton}`}
                                        >
                                            −
                                        </button>
                                        <span className={`w-6 text-center font-bold text-xs ${isLethal ? 'text-red-500' : ''}`}>
                                            {damage}
                                        </span>
                                        <button
                                            onClick={() => onUpdateCommanderDamage(playerIndex, otherIndex, 1)}
                                            className={`w-5 h-5 rounded glass-button text-xs flex items-center justify-center glass-button-hover-green ${theme.glassButton}`}
                                        >
                                            +
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ============================================================================
        // PLAYER CARD COMPONENT
        // ============================================================================
        function PlayerCard({ 
            player, 
            playerIndex, 
            allPlayers, 
            onUpdateLife, 
            onUpdateCounter, 
            onUpdateCommanderDamage, 
            onUpdatePlayerName, 
            darkMode 
        }) {
            const theme = getThemeClasses(darkMode);
            const counterConfigs = [
                { type: 'poison', icon: <Skull size={12} />, label: 'Poison', warning: player.poison >= POISON_WIN_THRESHOLD },
                { type: 'energy', icon: <Zap size={12} />, label: 'Energy', warning: false },
                { type: 'experience', icon: <Award size={12} />, label: 'Exp', warning: false }
            ];

            return (
                <div className={`${theme.card} rounded-lg p-3 border ${theme.border} flex flex-col overflow-hidden`}>
                    <input
                        type="text"
                        value={player.name}
                        onChange={(e) => onUpdatePlayerName(playerIndex, e.target.value)}
                        className={`w-full text-sm font-bold mb-2 bg-transparent border-b ${theme.border} focus:outline-none pb-1`}
                    />

                    <LifeCounter 
                        player={player} 
                        playerIndex={playerIndex} 
                        onUpdateLife={onUpdateLife}
                        darkMode={darkMode}
                    />

                    <div className="space-y-1 text-xs mb-2">
                        {counterConfigs.map(({ type, icon, label, warning }) => (
                            <CounterRow
                                key={type}
                                icon={icon}
                                label={label}
                                value={player[type]}
                                onDecrement={() => onUpdateCounter(playerIndex, type, -1)}
                                onIncrement={() => onUpdateCounter(playerIndex, type, 1)}
                                warning={warning}
                                darkMode={darkMode}
                            />
                        ))}
                    </div>

                    <CommanderDamage
                        player={player}
                        playerIndex={playerIndex}
                        allPlayers={allPlayers}
                        onUpdateCommanderDamage={onUpdateCommanderDamage}
                        darkMode={darkMode}
                    />
                </div>
            );
        }

        // ============================================================================
        // HEADER COMPONENT
        // ============================================================================
        function Header({ 
            numPlayers, 
            onSetNumPlayers, 
            darkMode, 
            onToggleDarkMode, 
            onUndo, 
            canUndo, 
            onReset 
        }) {
            const theme = getThemeClasses(darkMode);

            return (
                <div className="flex-shrink-0 px-2 py-2 border-b border-gray-700">
                    <div className="flex justify-between items-center gap-2">
                        <h1 className="text-lg font-bold">MTG</h1>
                        <div className="flex items-center gap-1">
                            <Users size={16} />
                            {SUPPORTED_PLAYER_COUNTS.map(num => (
                                <button
                                    key={num}
                                    onClick={() => onSetNumPlayers(num)}
                                    className={`px-2 py-1 rounded text-xs glass-button ${theme.glassButton} ${
                                        numPlayers === num 
                                            ? 'bg-blue-600 bg-opacity-60 text-white border-blue-400 border-opacity-40' 
                                            : ''
                                    }`}
                                >
                                    {num}
                                </button>
                            ))}
                        </div>
                        <div className="flex gap-1">
                            <button
                                onClick={onToggleDarkMode}
                                className={`p-1.5 rounded glass-button ${theme.glassButton}`}
                            >
                                {darkMode ? <Sun /> : <Moon />}
                            </button>
                            <button
                                onClick={onUndo}
                                disabled={!canUndo}
                                className={`p-1.5 rounded glass-button ${theme.glassButton} disabled:opacity-30`}
                            >
                                <RotateCcw />
                            </button>
                            <button
                                onClick={onReset}
                                className={`px-2 py-1.5 rounded glass-button text-xs ${theme.glassButton}`}
                            >
                                Reset
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // MAIN COMPONENT
        // ============================================================================
        function MTGLifeCounter() {
            const [darkMode, setDarkMode] = useState(true);
            const [numPlayers, setNumPlayers] = useState(2);
            const [history, setHistory] = useState([]);
            const [players, setPlayers] = useState(() => 
                Array(2).fill(null).map((_, i) => createPlayer(i))
            );

            // Update theme-color meta tag and body background when dark mode changes
            useEffect(() => {
                const themeColorMeta = document.getElementById('theme-color-meta');
                if (themeColorMeta) {
                    themeColorMeta.setAttribute('content', darkMode ? '#111827' : '#F3F4F6');
                }
                document.body.style.backgroundColor = darkMode ? '#111827' : '#F3F4F6';
            }, [darkMode]);

            // Update players when player count changes
            useEffect(() => {
                setPlayers(prevPlayers => {
                    return Array(numPlayers).fill(null).map((_, i) => 
                        prevPlayers[i] || createPlayer(i)
                    );
                });
            }, [numPlayers]);

            // History management
            const saveHistory = useCallback(() => {
                setHistory(prev => [...prev, deepClone(players)]);
            }, [players]);

            const undo = useCallback(() => {
                if (history.length > 0) {
                    const previous = history[history.length - 1];
                    setPlayers(previous);
                    setHistory(prev => prev.slice(0, -1));
                }
            }, [history]);

            // Player update functions
            const updateLife = useCallback((playerIndex, amount) => {
                saveHistory();
                setPlayers(prev => {
                    const newPlayers = [...prev];
                    newPlayers[playerIndex] = { ...newPlayers[playerIndex], life: newPlayers[playerIndex].life + amount };
                    return newPlayers;
                });
            }, [saveHistory]);

            const updateCounter = useCallback((playerIndex, counterType, amount) => {
                saveHistory();
                setPlayers(prev => {
                    const newPlayers = [...prev];
                    newPlayers[playerIndex] = {
                        ...newPlayers[playerIndex],
                        [counterType]: Math.max(0, newPlayers[playerIndex][counterType] + amount)
                    };
                    return newPlayers;
                });
            }, [saveHistory]);

            const updateCommanderDamage = useCallback((playerIndex, fromPlayerIndex, amount) => {
                saveHistory();
                setPlayers(prev => {
                    const newPlayers = [...prev];
                    const currentDamage = newPlayers[playerIndex].commanderDamage[fromPlayerIndex] || 0;
                    newPlayers[playerIndex] = {
                        ...newPlayers[playerIndex],
                        commanderDamage: {
                            ...newPlayers[playerIndex].commanderDamage,
                            [fromPlayerIndex]: Math.max(0, currentDamage + amount)
                        }
                    };
                    return newPlayers;
                });
            }, [saveHistory]);

            const updatePlayerName = useCallback((playerIndex, name) => {
                setPlayers(prev => {
                    const newPlayers = [...prev];
                    newPlayers[playerIndex] = { ...newPlayers[playerIndex], name };
                    return newPlayers;
                });
            }, []);

            const resetGame = useCallback(() => {
                if (confirm('Reset the game? This will clear all counters and history.')) {
                    setPlayers(prev => prev.map(p => ({
                        name: p.name,
                        life: DEFAULT_LIFE,
                        commanderDamage: {},
                        poison: 0,
                        energy: 0,
                        experience: 0
                    })));
                    setHistory([]);
                }
            }, []);

            const theme = getThemeClasses(darkMode);

            return (
                <div className={`h-full ${theme.bg} ${theme.text} transition-colors duration-200 flex flex-col relative`}>
                    <AnimatedBackground darkMode={darkMode} />
                    <div className="content-layer h-full flex flex-col">
                        <Header
                            numPlayers={numPlayers}
                            onSetNumPlayers={setNumPlayers}
                            darkMode={darkMode}
                            onToggleDarkMode={() => setDarkMode(prev => !prev)}
                            onUndo={undo}
                            canUndo={history.length > 0}
                            onReset={resetGame}
                        />

                        <div className="flex-1 overflow-hidden p-2">
                            <div className={`h-full grid gap-2 ${getGridClasses(numPlayers)}`}>
                                {players.map((player, playerIndex) => (
                                    <PlayerCard
                                        key={playerIndex}
                                        player={player}
                                        playerIndex={playerIndex}
                                        allPlayers={players}
                                        onUpdateLife={updateLife}
                                        onUpdateCounter={updateCounter}
                                        onUpdateCommanderDamage={updateCommanderDamage}
                                        onUpdatePlayerName={updatePlayerName}
                                        darkMode={darkMode}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MTGLifeCounter />, document.getElementById('root'));
    </script>
